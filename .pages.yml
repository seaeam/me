media:
  input: public/media
  output: /media
content:
  - name: home
    label: 首页正文
    type: file
    path: content/home.md
    fields:
      - { name: body, label: 简介, type: rich-text }
  - name: posts
    label: 文章
    type: collection
    path: content/posts
    filename: "{primary}.md"
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: date, label: 发布日期, type: date, required: true }
      - { name: duration, label: 阅读时长, type: string }
      - { name: body, label: 正文, type: rich-text }
  - name: projects
    label: 项目
    type: file
    path: content/projects.json
    list: true
    fields:
      - { name: name, label: 名称, type: string, required: true }
      - { name: group, label: 项目分组, type: string, description: 留空时归入 Current Focus }
      - { name: description, label: 简介, type: text }
      - { name: icon, label: 项目图标, type: image }
      - { name: url, label: 项目链接, type: string }
  - name: site
    label: 站点设置
    type: file
    path: content/site.json
    fields:
      - { name: name, label: 站名, type: string, required: true }
      - { name: blogLabel, label: 文章导航文字, type: string, required: true }
      - { name: projectsLabel, label: 项目导航文字, type: string, required: true }
      - { name: projectsIntro, label: 项目页简介, type: string }
      - { name: github, label: GitHub 主页, type: string }
